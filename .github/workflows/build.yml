# Builds the project and runs all tests (including the Testcontainers integration test) on every push
# to main and on pull requests. Publishing to a release is done by the Jar and Docker Image workflows.

name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes a running build obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Both Ubuntu images on purpose: "ubuntu-latest" has been switching from 24.04 (Docker 28) to
    # 26.04 (Docker 29), and the Testcontainers integration test depends on the Docker version.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Show the Docker version
        run: docker version --format 'client {{.Client.Version}}, server {{.Server.Version}}'

      - name: Build and test
        run: mvn -B verify

      # The log alone does not say why Testcontainers rejects a Docker environment; the reports do.
      - name: Keep the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports
          if-no-files-found: ignore
