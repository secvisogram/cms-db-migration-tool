# Builds the shaded migration tool jar and attaches it to the GitHub release.
# Manual runs only upload the jar as a workflow artifact.

name: Jar

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean package

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: csaf-couchdb-postgres-migrator
          path: target/csaf-couchdb-postgres-migrator.jar
          if-no-files-found: error

      - name: Attach jar to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" target/csaf-couchdb-postgres-migrator.jar --clobber
